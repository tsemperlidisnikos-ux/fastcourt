<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>FastCourt — Offline</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f172a;
        --text: #f8fafc;
        --muted: #94a3b8;
        --accent: #22c55e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: Calibri, "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      main {
        max-width: 420px;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        margin-bottom: 16px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        line-height: 1.5;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 10px;
        padding: 12px 20px;
        font-size: 1rem;
        font-weight: 600;
        background: var(--accent);
        color: #052e16;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/landing/fastcourt-intro-mark.png" alt="" />
      <h1>You are offline</h1>
      <p>
        FastCourt needs a connection to sign in or sync cloud data. Your saved
        plays on this device may still be available after you reconnect.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
